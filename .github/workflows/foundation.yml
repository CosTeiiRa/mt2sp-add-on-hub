name: Foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Audit public source
        run: python tools/check_public_tree.py
      - name: Run synthetic lifecycle and process-crash tests
        run: python -m unittest discover -s tests -v
