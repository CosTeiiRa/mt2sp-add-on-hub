[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt2sp-add-on-hub"
version = "0.1.0.dev0"
description = "Standalone add-on package and recovery foundation"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
game = ["lzokay==2.1.0"]

[project.scripts]
mt2sp-hub = "mt2sp_hub.cli:main"

[project.gui-scripts]
mt2sp-hub-ui = "mt2sp_hub.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]
